<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Two timed cards</title></head>
<body>
  <div id="cards" data-composition-id="cards" data-no-timeline data-start="0" data-duration="1" data-width="64" data-height="64" style="position:relative;width:64px;height:64px">
    <div id="warm" class="clip" data-start="0" data-duration="0.5" data-track-index="0" style="position:absolute;inset:0;background-color:red"></div>
    <div id="cool" class="clip" data-start="0.5" data-duration="0.5" data-track-index="0" style="position:absolute;inset:0;background-color:blue"></div>
  </div>
</body>
</html>
