<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Open studio invitation</title></head>
<body>
  <div id="invitation" data-composition-id="invitation" data-no-timeline data-start="0" data-duration="3" data-width="320" data-height="180" style="position:relative;width:320px;height:180px;overflow:hidden;background-color:#182434;font-family:monospace;line-height:1">
    <section id="event" class="clip" data-start="0" data-duration="2" data-track-index="0" style="position:absolute;inset:auto;left:16px;top:24px;width:250px;height:94px;background-color:#834030">
      <strong style="position:absolute;left:12px;top:10px;font-size:28px;color:white">Open studio</strong>
    </section>
    <section id="time" class="clip" data-start="1" data-duration="2" data-track-index="1" style="position:absolute;inset:auto;left:100px;top:84px;width:204px;height:64px;background-color:#185a50">
      <span style="position:absolute;left:12px;top:10px;font-size:22px;color:#ffdd33">Friday at six</span>
    </section>
  </div>
</body>
</html>
