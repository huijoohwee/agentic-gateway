name: Integration
on:
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  check:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Enforce shared owner reuse
        uses: huijoohwee/agentic-os/.github/actions/owner-reuse@d2accfda2bbf1f96175267d2ae2bf9be596801c6
        with:
          baseline: cdb000925729a729732206a32de36e6bc7db011c
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Verify pinned reference sources
        shell: bash
        run: |
          owners="$RUNNER_TEMP/reference-owners"
          mapfile -t repositories < <(jq -r 'keys[]' references/owners.json)
          for owner in "${repositories[@]}"; do
            [[ "$owner" =~ ^[a-z0-9]+([.-][a-z0-9]+)*$ ]]
            repo="$owners/$owner"
            pin=$(jq -er --arg owner "$owner" '.[$owner].revision' references/owners.json)
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
            git init -q "$repo"
            git -C "$repo" remote add origin "https://github.com/huijoohwee/$owner.git"
            git -C "$repo" fetch -q --no-tags --depth=1 --filter=blob:none origin "$pin"
            jq -r --arg owner "$owner" '.[$owner].entries[].path | "/" + .' references/owners.json |
              git -C "$repo" sparse-checkout set --no-cone --stdin
            git -C "$repo" checkout -q --detach FETCH_HEAD
          done
          GIT_NO_LAZY_FETCH=1 npm run references:check -- --owners "$owners"
